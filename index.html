<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>춘해보건대학교 앵커사업단</title>
<meta name="description" content="춘해보건대학교 지역성장 인재양성체계(앵커) 사업단 홈페이지">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--g:#0b6b45;--g2:#1f8a5b;--gl:#e6f1ec;--dk:#03140d;--b:#1d4f9a;--t:#1b1f1d;--m:#6b736f;--line:#e3e7e5;--w:1240px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Pretendard,'Apple SD Gothic Neo',sans-serif;color:var(--t);word-break:keep-all;background:#fff}
a{color:inherit;text-decoration:none}ul{list-style:none}button{font:inherit;cursor:pointer;border:0;background:none}
.inner{max-width:var(--w);margin:0 auto;padding:0 20px}
/* header */
header{position:fixed;top:0;left:0;right:0;z-index:50;height:80px;transition:.3s}
header.on,header.sub,header:hover{background:#fff;box-shadow:0 1px 0 var(--line)}
.hd{display:flex;align-items:center;height:80px;padding:0 40px}
.logo{display:flex;align-items:center;gap:10px;color:#fff;min-width:260px}
header.on .logo,header.sub .logo,header:hover .logo{color:var(--g)}
.logo svg{width:38px;height:38px}.logo b{font-size:25px;font-weight:800;letter-spacing:-.5px}.logo b span{font-weight:700}
.logo small{display:block;font-size:8.5px;letter-spacing:.2px;font-weight:600;opacity:.85;margin-top:-2px}
.gnb{display:flex;flex:1;justify-content:center}
.gnb>li{position:relative;width:180px;text-align:center}
.gnb>li>a{display:block;line-height:80px;font-size:17px;font-weight:600;color:#fff}
header.on .gnb>li>a,header.sub .gnb>li>a,header:hover .gnb>li>a{color:var(--t)}
.gnb>li.cur>a{color:var(--g)!important}
.gnb .dep2{display:none;position:absolute;top:80px;left:0;right:0;padding:18px 0 22px;background:#fff}
header:hover .dep2{display:block}
header:hover::after{content:"";position:absolute;top:80px;left:0;right:0;height:190px;background:#fff;border-top:1px solid var(--line);box-shadow:0 10px 20px rgba(0,0,0,.05);z-index:-1}
.dep2 a{display:block;padding:7px 0;font-size:15px;color:#555}.dep2 a:hover{color:var(--g);font-weight:600}
.util{display:flex;gap:18px;min-width:260px;justify-content:flex-end}
.util button{width:32px;height:32px;color:#fff}header.on .util button,header.sub .util button,header:hover .util button{color:var(--t)}
.util svg{width:28px;height:28px}
/* sitemap */
#sitemap{position:fixed;inset:0;background:rgba(3,20,13,.97);z-index:100;display:none;color:#fff;overflow:auto}
#sitemap.open{display:block}
#sitemap .close{position:absolute;right:40px;top:24px;color:#fff;font-size:40px;line-height:1}
.smap{display:grid;grid-template-columns:repeat(4,1fr);gap:40px;max-width:var(--w);margin:120px auto 60px;padding:0 20px}
.smap h3{font-size:22px;padding-bottom:16px;border-bottom:2px solid var(--g2);margin-bottom:16px}
.smap a{display:block;padding:8px 0;color:#cfd8d3}.smap a:hover{color:#fff}
.srch{max-width:640px;margin:0 auto;padding:0 20px;display:flex;gap:8px}
.srch input{flex:1;height:52px;border-radius:26px;border:0;padding:0 24px;font:inherit;font-size:16px}
.srch button{height:52px;padding:0 26px;border-radius:26px;background:var(--g2);color:#fff;font-weight:600}
/* hero */
.hero{position:relative;height:100vh;min-height:720px;overflow:hidden;color:#fff}
.slide{position:absolute;inset:0;opacity:0;transition:opacity 1.2s;background-size:cover;background-position:center}
.slide.act{opacity:1}
.s1{background:radial-gradient(circle at 75% 35%,rgba(31,138,91,.55),transparent 45%),radial-gradient(circle at 20% 80%,rgba(29,79,154,.55),transparent 45%),linear-gradient(135deg,#052a1b,#0b4a33 50%,#0e2f57)}
.s2{background:radial-gradient(circle at 70% 60%,rgba(29,79,154,.6),transparent 50%),linear-gradient(135deg,#0d2440,#0b6b45)}
.s3{background:radial-gradient(circle at 30% 30%,rgba(120,200,160,.35),transparent 45%),linear-gradient(135deg,#033322,#14593f 60%,#1d4f9a)}
.slide::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 1px,transparent 1px 120px),repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 120px)}
.ring{position:absolute;border:1px solid rgba(255,255,255,.18);border-radius:50%}
.hcopy{position:absolute;left:8%;top:31%;z-index:2}
.hcopy p{font-size:30px;font-weight:400;margin-bottom:16px}
.hcopy h1{font-size:58px;font-weight:800;letter-spacing:-1px}
.hbar{display:flex;gap:6px;margin-top:60px;align-items:center}
.hbar i{display:block;width:74px;height:3px;background:rgba(255,255,255,.35);position:relative;cursor:pointer}
.hbar i.act::after{content:"";position:absolute;left:0;top:0;bottom:0;background:#fff;animation:prog 6s linear forwards}
@keyframes prog{from{width:0}to{width:100%}}
.hbar button{width:28px;height:28px;border:1px solid #fff;border-radius:50%;color:#fff;font-size:10px;margin-left:8px}
.qtab{position:absolute;left:8%;bottom:70px;z-index:2}
.qtab .tabs{display:inline-flex;border:1.5px solid #fff;border-radius:22px;padding:2px;margin-bottom:22px}
.qtab .tabs button{color:#fff;padding:9px 34px;border-radius:20px;font-size:15px;font-weight:600}
.qtab .tabs button.act{background:var(--g);}
.qicons{display:flex;gap:10px}
.qicons a{width:98px;height:98px;border-radius:14px;background:#fff;color:var(--g);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:12.5px;font-weight:700;text-align:center;transition:.2s}
.qicons a:nth-child(-n+2){background:var(--g);color:#fff}
.qicons a:hover{transform:translateY(-4px)}
.qicons svg{width:40px;height:40px}
.scroll{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);font-size:13px;text-align:center;z-index:2}
.scroll span{display:block;width:30px;height:30px;border:1px solid #fff;border-radius:50%;margin:8px auto 0;line-height:28px}
.vcard{position:absolute;right:0;bottom:30px;width:270px;background:rgba(255,255,255,.12);backdrop-filter:blur(6px);border-radius:14px 0 0 14px;padding:16px;z-index:2;font-size:13px}
.vcard .th{height:130px;border-radius:8px;margin-top:10px;background:linear-gradient(135deg,#1f8a5b,#1d4f9a);display:flex;align-items:center;justify-content:center;font-size:30px}
/* dash */
.dash{background:var(--dk);color:#fff;padding:110px 0;position:relative;overflow:hidden}
.dash .wrap{display:grid;grid-template-columns:200px 1fr 420px;gap:40px;align-items:center;max-width:1400px;margin:0 auto;padding:0 40px}
.plist button{display:block;color:#7f8f88;font-size:14.5px;padding:9px 0;text-align:left}
.plist button.act{color:#fff;font-weight:700}.plist button.act::after{content:" ›"}
.dmid{text-align:center}
.dmid .lab{color:#53d39a;font-size:14px;font-weight:700}
.dmid h2{font-size:34px;margin:14px 0 40px;font-weight:700}
.dcards{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.dcards div{width:128px;height:118px;border:1px solid rgba(255,255,255,.15);border-radius:10px;background:rgba(255,255,255,.04);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-size:13px;padding:8px}
.dcards svg{width:28px;height:28px;color:#53d39a}
.dmid ul{display:inline-block;text-align:left;margin-top:40px}
.dmid li{font-size:15px;color:#cfd8d3;padding:6px 0}.dmid li::before{content:"·";margin-right:10px;color:#53d39a}
.circ{width:380px;height:380px;border-radius:50%;margin:auto;position:relative;background:radial-gradient(circle at 35% 30%,#2aa56f,#0b6b45 55%,#073d29);display:flex;align-items:center;justify-content:center;flex-direction:column;box-shadow:0 0 0 30px rgba(255,255,255,.03),0 0 0 70px rgba(255,255,255,.02)}
.circ b{font-size:120px;font-weight:800;line-height:1}.circ span{font-size:15px;margin-top:10px;opacity:.9}
/* news */
.newszone{background:#edf2f0;padding:90px 0}
.ngrid{display:grid;grid-template-columns:1.9fr 1fr;gap:20px}
.box{background:#fff;border-radius:10px;padding:26px 30px;box-shadow:0 2px 10px rgba(0,0,0,.03);position:relative}
.box .more{position:absolute;right:24px;top:24px;width:26px;height:26px;border:1px solid #bbb;border-radius:50%;font-size:16px;line-height:23px;text-align:center}
.btabs{display:flex;gap:6px;margin-bottom:18px}
.btabs button{padding:7px 14px;font-size:16px;color:#888;font-weight:600}.btabs button.act{color:var(--t);font-weight:800;border-bottom:2px solid var(--g)}
.blist li a{display:flex;align-items:center;gap:12px;padding:9px 0;font-size:14.5px}
.blist .tag{font-size:12px;background:var(--gl);color:var(--g);padding:3px 9px;border-radius:12px;white-space:nowrap}
.blist .tt{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.blist .dt{color:#888;font-size:13px}
.empty{color:#999;font-size:14px;padding:26px 0;text-align:center}
.banner{background:linear-gradient(135deg,#e6f1ec,#dde8f6);border-radius:10px;display:flex;flex-direction:column;justify-content:center;padding:30px;min-height:200px}
.banner small{color:var(--g);font-weight:700}.banner h3{font-size:26px;margin:8px 0 18px;line-height:1.35}
.banner a{align-self:flex-start;background:#fff;color:var(--g);padding:9px 22px;border-radius:20px;font-size:14px;font-weight:700}
.ngrid2{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}
.box h4{font-size:17px;margin-bottom:18px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.card .th{height:110px;border-radius:8px;background:linear-gradient(135deg,#cfe3d9,#d6e1f2);display:flex;align-items:center;justify-content:center;color:var(--g);font-weight:800;font-size:13px;text-align:center;padding:8px}
.card p{font-size:13px;margin-top:8px;color:#555;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.nl .th{background:linear-gradient(135deg,#6f8a5b,#4f6b3e);color:#fff;font-family:Georgia,serif;font-size:16px;line-height:1.1}
.nl:nth-child(2) .th{background:linear-gradient(135deg,#d68a52,#b8692f)}.nl:nth-child(3) .th{background:linear-gradient(135deg,#c2a36a,#a3824a)}
/* partners */
.partners{background:#f5f7f6;padding:90px 0}
.ptop{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:24px}
.ptop h2{font-size:32px}.ptop p{color:#555;font-size:14px;margin-top:6px}
.ptabs button{padding:10px 18px;font-size:14px;color:#666}.ptabs button.act{color:var(--g);font-weight:700;border-bottom:2px solid var(--g)}
.pwrap{display:grid;grid-template-columns:1.85fr 1fr;background:#fff;border-radius:10px;overflow:hidden;border:1px solid var(--line);height:440px}
.pwrap iframe{width:100%;height:100%;border:0}
.plist2{overflow:auto;padding:10px 20px}
.plist2 li{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid #f0f0f0}
.plist2 em{font-style:normal;width:30px;height:30px;border-radius:50%;background:var(--g);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;flex:none}
.plist2 b{font-size:14px;display:block}.plist2 small{color:#888;font-size:12px}
/* video */
.vzone{background:linear-gradient(rgba(10,30,22,.85),rgba(10,30,22,.85)),linear-gradient(135deg,#0b6b45,#1d4f9a);padding:70px 0}
.vrow{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:30px;align-items:center}
.vbox{aspect-ratio:16/10;border-radius:10px;background:linear-gradient(135deg,#1f8a5b,#0e2f57);display:flex;align-items:center;justify-content:center;color:#fff;position:relative;font-weight:700;text-align:center;padding:20px}
.vbox:nth-child(2){aspect-ratio:16/9}
.vbox::before{content:"▶";position:absolute;width:58px;height:58px;border:2px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;opacity:.9;top:50%;left:50%;transform:translate(-50%,-50%)}
.vbox span{position:absolute;bottom:16px;left:0;right:0;font-size:14px}
/* footer */
footer{background:#2b2b2b;color:#aaa;font-size:13px}
.flinks{border-bottom:1px solid #3a3a3a}
.flinks .inner{display:flex;align-items:center;height:64px;gap:0}
.flinks a{color:#ddd;padding:0 22px;position:relative}.flinks a:first-child{padding-left:0}
.flinks a+a::before{content:"";position:absolute;left:0;top:50%;width:3px;height:3px;background:#777;border-radius:50%}
.flinks select{margin-left:auto;background:transparent;border:1px solid #666;color:#ddd;height:40px;width:250px;padding:0 14px;border-radius:4px;font:inherit}
.flinks option{color:#000}
.fbot .inner{display:flex;align-items:center;gap:30px;padding-top:30px;padding-bottom:36px}
.fbot .logo{color:#fff;min-width:auto}.fbot .sns{margin-left:auto;display:flex;gap:12px}
.fbot .sns a{width:30px;height:30px;border-radius:50%;background:#444;color:#ddd;display:flex;align-items:center;justify-content:center;font-size:11px}
/* quick */
.quick{position:fixed;right:24px;bottom:24px;z-index:40;display:flex;flex-direction:column;gap:10px}
.quick a,.quick button{width:56px;height:56px;border-radius:50%;background:var(--g);color:#fff;font-size:10.5px;font-weight:700;line-height:1.1;display:flex;align-items:center;justify-content:center;text-align:center;box-shadow:0 4px 10px rgba(0,0,0,.2)}
.quick button{background:#333;font-size:20px}
/* sub */
.svis{height:300px;margin-top:80px;background:radial-gradient(circle at 12% 40%,rgba(255,255,255,.6) 0 60px,transparent 61px),radial-gradient(circle at 88% 70%,rgba(255,255,255,.45) 0 110px,transparent 111px),linear-gradient(#e7f0ec,#eef4f1);position:relative;text-align:center;padding-top:80px}
.svis .bc{font-size:12px;color:#555}.svis .bc b{color:var(--g);margin:0 6px}
.svis h2{font-size:34px;margin-top:10px}
.snav{position:absolute;left:50%;bottom:-24px;transform:translateX(-50%);width:calc(100% - 40px);max-width:var(--w);display:flex;align-items:flex-end}
.snav select{width:205px;height:56px;border:1px solid var(--line);background:#fff;padding:0 18px;font:inherit;font-size:14px;color:#555}
.snav .tools{margin-left:auto;display:flex;gap:8px;margin-bottom:38px}
.snav .tools button{width:38px;height:38px;border-radius:50%;background:#fff;border:1px solid var(--line);font-size:14px}
.cont{max-width:var(--w);margin:0 auto;padding:110px 20px 100px;min-height:50vh}
.stit{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid var(--g);padding-bottom:16px;margin:0 0 30px}
.stit h3{font-size:22px}.stit small{color:#555;font-size:13px}
.cont section+section{margin-top:70px}
.vgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.vgrid div{border-radius:6px;padding:26px 18px;background:var(--gl);border:1px solid #cfe3d9;color:var(--g);font-weight:700;font-size:16px}
.vgrid div:first-child{background:var(--g);color:#fff;box-shadow:0 6px 14px rgba(11,107,69,.25)}
.vgrid i{display:inline-block;font-style:normal;font-size:11px;background:#fff;color:var(--g);padding:3px 9px;border-radius:3px;margin-bottom:10px}
.vgrid div:nth-child(2) i{background:var(--g);color:#fff}
.kt{margin:28px 0 14px;font-weight:700}.kt::before{content:"✔";display:inline-flex;width:18px;height:18px;border-radius:50%;background:var(--g);color:#fff;font-size:10px;align-items:center;justify-content:center;margin-right:8px}
.kgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kgrid div{border:1px solid var(--line);border-radius:8px;padding:22px;text-align:center;font-size:14px;color:#555}
.kgrid b{display:block;font-size:22px;color:var(--g);margin-top:8px}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px;border-top:2px solid var(--t)}
.tbl th{background:#f6f8f7;font-weight:700;padding:14px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:14px 10px;border-bottom:1px solid var(--line);text-align:center}
.tbl td.l{text-align:left}
.tbl tr.hl td{background:#f2f8f5}
.badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:10px;background:var(--g);color:#fff}
.pcards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.pcards div{border:1px solid var(--line);border-top:4px solid var(--g);border-radius:8px;padding:22px}
.pcards b{color:var(--g);font-size:13px}.pcards h4{font-size:18px;margin:6px 0 12px}.pcards p{font-size:14px;color:#555;line-height:1.6}
.para{line-height:1.8;color:#444;font-size:15.5px}
.blist2 .tbl td.l a:hover{color:var(--g);text-decoration:underline}
.faq details{border-bottom:1px solid var(--line)}.faq summary{padding:20px 10px;font-weight:600;cursor:pointer;list-style:none}
.faq summary::before{content:"Q";color:var(--g);font-weight:800;margin-right:14px}.faq details p{padding:0 10px 20px 36px;color:#555;line-height:1.7}
.mapbox{height:420px;border:1px solid var(--line);border-radius:8px;overflow:hidden}.mapbox iframe{width:100%;height:100%;border:0}
.info{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:20px}
.info div{background:#f6f8f7;border-radius:8px;padding:22px;font-size:14.5px;line-height:1.7}.info b{display:block;color:var(--g);margin-bottom:6px}
.note{font-size:13px;color:#888;margin-top:14px}
.btn{display:inline-block;background:var(--g);color:#fff;padding:12px 28px;border-radius:24px;font-weight:600;font-size:15px}
@media(max-width:1100px){.gnb{display:none}.hd{padding:0 20px}.logo{min-width:auto}.util{min-width:auto;margin-left:auto}.dash .wrap{grid-template-columns:1fr}.circ{display:none}.ngrid,.ngrid2,.pwrap,.vrow{grid-template-columns:1fr}.pwrap{height:auto}.pwrap iframe{height:300px}.smap{grid-template-columns:1fr 1fr}.pcards,.kgrid{grid-template-columns:1fr 1fr}}
@media(max-width:680px){.hcopy h1{font-size:34px}.hcopy p{font-size:18px}.qicons a{width:62px;height:62px;font-size:10px}.qicons svg{width:24px;height:24px}.qtab .tabs button{padding:8px 16px}.vcard{display:none}.cards{grid-template-columns:1fr 1fr}.vgrid,.info,.pcards,.kgrid{grid-template-columns:1fr}.snav select{width:50%}.snav .tools{display:none}.flinks .inner{flex-wrap:wrap;height:auto;padding:14px 20px}.flinks select{margin:10px 0 0;width:100%}.fbot .inner{flex-wrap:wrap}.ptop{flex-direction:column;align-items:flex-start;gap:10px}.tbl{font-size:13px}}
</style>
</head>
<body>
<header id="hd">
 <div class="hd">
  <a href="#/" class="logo" aria-label="춘해보건대학교 앵커사업단 홈">
   <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><circle cx="20" cy="8" r="4"/><path d="M20 12v24M10 18h20M6 24c0 8 6 12 14 12s14-4 14-12"/></svg>
   <div><b>ANCHOR<span>사업단</span></b><small>CHOONHAE HEALTH SCIENCES UNIVERSITY ANCHOR PROJECT GROUP</small></div>
  </a>
  <ul class="gnb" id="gnb"></ul>
  <div class="util">
   <button onclick="openMap(1)" aria-label="검색"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></button>
   <button onclick="openMap()" aria-label="전체메뉴"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 6h18M6 12h15M3 18h18"/></svg></button>
  </div>
 </div>
</header>

<div id="sitemap">
 <button class="close" onclick="closeMap()" aria-label="닫기">×</button>
 <div class="smap" id="smap"></div>
 <form class="srch" onsubmit="return doSearch(event)"><input id="q" placeholder="검색어를 입력하세요"><button>검색</button></form>
 <div class="smap" id="sres" style="margin-top:30px;grid-template-columns:1fr"></div>
</div>

<main id="app"></main>

<footer>
 <div class="flinks"><div class="inner">
  <a href="#/overview">앵커사업 개요</a><a href="#/projects">프로젝트 및 단위과제</a><a href="#/notice">공지사항</a><a href="#/location">오시는 길</a>

const BOARD_EN={notice:'Notice',press:'Press',call:'Project Announcement',video:'Promotional Video',newsletter:'Newsletter',archive:'Archive'};
function boardPage(k,idx){const a=BOARD[k],lab=findMenu(k)[1][1];
 if(idx!=null&&a[idx]){const p=a[idx];return `<section>${stit(lab,BOARD_EN[k])}<table class="tbl"><tr><th class="l" style="text-align:left;font-size:18px">${esc(p.t)}</th></tr><tr><td class="l" style="color:#888">등록일 ${p.d} · 춘해보건대학교 앵커사업단</td></tr><tr><td class="l para" style="padding:40px 10px;white-space:pre-line">${esc(p.b||'')}</td></tr></table><p style="text-align:center;margin-top:30px"><a class="btn" href="#/${k}">목록</a></p></section>`}
 return `<section>${stit(lab,BOARD_EN[k])}<p style="font-size:14px;margin-bottom:12px">전체 <b style="color:var(--g)">${a.length}</b>건</p>
 <table class="tbl"><tr><th style="width:80px">번호</th><th>제목</th><th style="width:140px">작성자</th><th style="width:120px">등록일</th></tr>
 ${a.length?a.map((p,i)=>`<tr><td>${a.length-i}</td><td class="l"><a href="#/${k}/${i}">${esc(p.t)}</a></td><td>앵커사업단</td><td>${p.d}</td></tr>`).join(''):'<tr><td colspan="4" class="empty">등록된 게시물이 없습니다.</td></tr>'}</table></section>`}

function sub(id,idx){const f=findMenu(id);if(!f)return null;const[m,c]=f;
 const body=PAGES[id]?PAGES[id]():boardPage(id,idx);
 return `<div class="svis"><p class="bc">HOME <b>›</b> ${m.t}</p><h2>${c[1]}</h2>
 <div class="snav"><select onchange="location.hash='#/'+this.value">${MENU.map(x=>`<option value="${x.c[0][0]}" ${x===m?'selected':''}>${x.t}</option>`).join('')}</select><select onchange="location.hash='#/'+this.value">${m.c.map(x=>`<option value="${x[0]}" ${x===c?'selected':''}>${x[1]}</option>`).join('')}</select>
 <div class="tools"><button onclick="zoom(-1)" title="축소">−</button><button onclick="zoom(1)" title="확대">+</button><button onclick="location.hash='#/'" title="홈">⌂</button><button onclick="print()" title="인쇄">⎙</button><button onclick="share()" title="공유">⇪</button></div></div></div>
 <div class="cont">${body}</div>`}
let z=1;function zoom(d){z=Math.min(1.3,Math.max(.9,z+d*.1));$('.cont').style.zoom=z}
function share(){navigator.clipboard&&navigator.clipboard.writeText(location.href);alert('주소가 복사되었습니다.')}

function route(){const h=location.hash.replace(/^#\/?/,'').split('/');const id=h[0]||'';
 const hd=$('#hd');let html;
 if(!id){html=home();hd.className=''}else{html=sub(id,h[1]!=null?+h[1]:null)||home();hd.className='sub'}
 $('#app').innerHTML=html;scrollTo(0,0);
 document.querySelectorAll('.gnb>li').forEach((li,i)=>li.classList.toggle('cur',!!id&&MENU[i].c.some(c=>c[0]===id)));
 const t=findMenu(id);document.title=t?`${t[1][1]} | 춘해보건대학교 앵커사업단`:'춘해보건대학교 앵커사업단';
 if(!id||!t)homeInit();else clearInterval(heroT)}
addEventListener('hashchange',route);
addEventListener('scroll',()=>{if(!location.hash.replace(/^#\/?/,''))$('#hd').classList.toggle('on',scrollY>60)});
addEventListener('keydown',e=>{if(e.key==='Escape')closeMap()});
route();
</script>
